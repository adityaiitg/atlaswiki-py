[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlaswiki"
version = "0.1.0"
description = "High-performance Markdown wiki indexer, knowledge graph, and semantic search engine"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Aditya Pratap Singh", email = "adsingh@zetaglobal.com" }]
keywords = ["markdown", "wiki", "knowledge-graph", "semantic-search", "obsidian", "pkb"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
]
dependencies = [
    "pyyaml>=5.4",
    "rich>=12.0.0",
]

[project.optional-dependencies]
ml = [
    "numpy>=1.20.0",
    "model2vec>=0.5.0",
]
dev = [
    "pytest>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/adityaiitg/atlaswiki-py"
Repository = "https://github.com/adityaiitg/atlaswiki-py"

[project.scripts]
atlaswiki = "atlaswiki.cli:main"
atlaswiki-mcp = "atlaswiki.mcp:main"

[tool.setuptools.packages.find]
where = ["src"]
